<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开放平台 - 调用日志</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/sdms-design-tokens.css">
<link rel="stylesheet" href="../assets/css/open-platform.css">
<style>
/* === 筛选条 === */
.op-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  padding: 16px 20px;
  background: var(--color-bg-primary, #fff);
  border: 1px solid var(--op-card-border);
  border-radius: var(--op-card-radius);
  box-shadow: var(--op-card-shadow);
  margin-bottom: 16px;
}

.op-filter-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.op-filter-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-tertiary, #909499);
  white-space: nowrap;
}

.op-filter-bar .op-input,
.op-filter-bar .op-select {
  height: 32px;
  font-size: 12px;
  min-width: 140px;
}

.op-filter-bar .op-input[type="date"] {
  min-width: 130px;
}

.op-filter-bar .op-input.op-filter-keyword {
  min-width: 200px;
}

.op-filter-date-range {
  display: flex;
  align-items: center;
  gap: 6px;
}

.op-filter-date-range .op-separator {
  color: var(--color-text-tertiary, #909499);
  font-size: 12px;
  padding-bottom: 1px;
}

.op-filter-bar .op-btn {
  height: 32px;
  padding: 0 16px;
  font-size: 12px;
}

/* === 日志表格卡片 === */
.op-log-card {
  background: var(--color-bg-primary, #fff);
  border: 1px solid var(--op-card-border);
  border-radius: var(--op-card-radius);
  box-shadow: var(--op-card-shadow);
}

.op-log-card .op-table-wrap {
  overflow-x: auto;
}

.op-log-card .op-table th,
.op-log-card .op-table td {
  font-size: 12px;
}

/* Key类型标签 */
.op-tag-prod {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  background: #e3f2ff;
  color: #1684fc;
  border: 1px solid #d5e9fe;
}

.op-tag-test {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  background: #e5f2e8;
  color: #007e22;
  border: 1px solid #c3f0c3;
}

/* HTTP方法标签 */
.op-method-tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 700;
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  margin-right: 6px;
}

.op-method-post   { background: #e8f8e8; color: #007e22; }
.op-method-get    { background: #e3f2ff; color: #1684fc; }
.op-method-put    { background: #fff2e9; color: #ff8225; }
.op-method-delete { background: #fff2f0; color: #ff4d4f; }

/* 状态码标签 */
.op-status-code {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
}

.op-code-2xx { background: #e5f2e8; color: #007e22; }
.op-code-4xx { background: #fdf6ec; color: #e6a23c; }
.op-code-401 { background: #fff2f0; color: #ff4d4f; }
.op-code-429 { background: #fff2e9; color: #ff8225; }
.op-code-5xx { background: #fff2f0; color: #ff4d4f; }

/* 耗时 */
.op-duration {
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  font-size: 12px;
  font-weight: 600;
}

.op-duration.fast    { color: var(--color-text-secondary, #65686c); }
.op-duration.warning { color: #ff8225; }
.op-duration.danger  { color: #ff4d4f; }

/* 请求ID链接 */
.op-req-id {
  color: var(--color-primary, #1684fc);
  cursor: pointer;
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  font-size: 12px;
  text-decoration: none;
  transition: color 0.15s ease;
}

.op-req-id:hover {
  text-decoration: underline;
  color: var(--color-primary-hover, #459dfd);
}

/* === 分页器 === */
.op-pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-top: 1px solid var(--op-card-border);
  font-size: 12px;
  color: var(--color-text-tertiary, #909499);
}

.op-pagination-info {
  display: flex;
  align-items: center;
  gap: 4px;
}

.op-pagination-pages {
  display: flex;
  align-items: center;
  gap: 4px;
}

.op-page-btn {
  height: 28px;
  min-width: 28px;
  padding: 0 8px;
  border: 1px solid var(--color-border-strong, #d2d7dd);
  border-radius: 4px;
  background: #fff;
  font-size: 12px;
  color: var(--color-text-primary, #1c1d1e);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  font-family: inherit;
}

.op-page-btn:hover {
  border-color: var(--color-primary, #1684fc);
  color: var(--color-primary, #1684fc);
}

.op-page-btn.active {
  background: var(--color-primary, #1684fc);
  border-color: var(--color-primary, #1684fc);
  color: #fff;
  font-weight: 600;
}

.op-page-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* === 详情弹窗（大弹窗700px） === */
.op-modal-xl {
  width: 700px;
}

.op-detail-section {
  margin-bottom: 20px;
}

.op-detail-section:last-child {
  margin-bottom: 0;
}

.op-detail-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-primary, #1c1d1e);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--color-border, #e7eaee);
  display: flex;
  align-items: center;
  gap: 6px;
}

.op-detail-section-title i {
  font-size: 15px;
  color: var(--color-text-tertiary, #909499);
}

/* 请求信息头 */
.op-req-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 13px;
}

.op-req-meta-url {
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  color: var(--color-text-primary, #1c1d1e);
  font-weight: 600;
}

/* Header列表 */
.op-header-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-bottom: 12px;
}

.op-header-table th {
  background: var(--color-bg-tertiary, #edeff2);
  padding: 6px 10px;
  text-align: left;
  font-weight: 600;
  color: var(--color-text-tertiary, #909499);
  border-bottom: 1px solid var(--color-border, #e7eaee);
}

.op-header-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--color-border, #e7eaee);
  color: var(--color-text-primary, #1c1d1e);
}

.op-header-table td:first-child {
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  font-weight: 600;
  white-space: nowrap;
  color: var(--color-text-secondary, #65686c);
  width: 140px;
}

.op-header-table td:last-child {
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  word-break: break-all;
}

/* JSON代码块 */
.op-json-block {
  background: var(--color-bg-tertiary, #f4f5f7);
  border: 1px solid var(--color-border, #e7eaee);
  border-radius: 4px;
  padding: 12px 16px;
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  font-size: 12px;
  line-height: 1.7;
  color: var(--color-text-primary, #1c1d1e);
  overflow-x: auto;
  white-space: pre;
}

/* JSON语法高亮 */
.json-key   { color: #1684fc; }
.json-str   { color: #007e22; }
.json-num   { color: #ff8225; }
.json-bool  { color: #7d67ff; }
.json-null  { color: #909499; }
.json-brace { color: var(--color-text-secondary, #65686c); }

/* 耗时大字展示 */
.op-duration-display {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.op-duration-value {
  font-size: 32px;
  font-weight: 700;
  font-family: "SF Mono", "Consolas", "Monaco", monospace;
  color: var(--color-text-primary, #1c1d1e);
}

.op-duration-value.fast    { color: #007e22; }
.op-duration-value.warning { color: #ff8225; }
.op-duration-value.danger  { color: #ff4d4f; }

.op-duration-unit {
  font-size: 14px;
  color: var(--color-text-tertiary, #909499);
  font-weight: 500;
}

.op-duration-error {
  margin-top: 8px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 14px;
  background: #fff2f0;
  border: 1px solid #ffccc7;
  border-radius: 4px;
  font-size: 12px;
  color: #ff4d4f;
  line-height: 1.6;
}

.op-duration-error i {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* === 响应式 === */
@media (max-width: 1200px) {
  .op-filter-bar {
    gap: 10px;
  }
  .op-filter-bar .op-input,
  .op-filter-bar .op-select {
    min-width: 120px;
  }
}
</style>
</head>
<body>

<header id="opTopNav"></header>
<div class="op-page no-sidebar">

  <!-- 右侧主区域 -->
  <div class="op-main">

    <!-- 顶部标题栏 -->
    <div class="op-header">
      <div class="op-header-breadcrumb">
        <a href="#">开放平台</a>
        <i class="ri-arrow-right-s-line"></i>
        <span>调用日志</span>
      </div>
      <div class="op-header-actions">
        <a href="#" class="op-btn op-btn-default" style="font-size:12px;height:30px;padding:0 12px">
          <i class="ri-question-line"></i> 帮助文档
        </a>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="op-content">

      <!-- 页面标题 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2 style="margin:0;font-size:18px;font-weight:700;color:var(--color-text-primary)">调用日志</h2>
      </div>

      <!-- 筛选条 -->
      <div class="op-filter-bar" id="filterBar">
        <div class="op-filter-item">
          <span class="op-filter-label">时间范围</span>
          <div class="op-filter-date-range">
            <input class="op-input" type="date" id="filterDateStart">
            <span class="op-separator">—</span>
            <input class="op-input" type="date" id="filterDateEnd">
          </div>
        </div>
        <div class="op-filter-item">
          <span class="op-filter-label">应用</span>
          <select class="op-select" id="filterApp">
            <option value="">全部应用</option>
          </select>
        </div>
        <div class="op-filter-item">
          <span class="op-filter-label">Key类型</span>
          <select class="op-select" id="filterKeyType">
            <option value="">全部</option>
            <option value="prod">生产Key</option>
            <option value="test">测试Key</option>
          </select>
        </div>
        <div class="op-filter-item">
          <span class="op-filter-label">接口</span>
          <select class="op-select" id="filterApi">
            <option value="">全部</option>
            <option value="POST /api/v1/orders">POST /api/v1/orders</option>
            <option value="PUT /api/v1/orders/{orderNo}">PUT /api/v1/orders/{orderNo}</option>
            <option value="GET /api/v1/orders/{orderNo}">GET /api/v1/orders/{orderNo}</option>
            <option value="DELETE /api/v1/orders/{orderNo}">DELETE /api/v1/orders/{orderNo}</option>
            <option value="GET /api/v1/inventory">GET /api/v1/inventory</option>
            <option value="POST /api/v1/inventory/adjust">POST /api/v1/inventory/adjust</option>
            <option value="POST /api/v1/shipments">POST /api/v1/shipments</option>
            <option value="GET /api/v1/shipments/{shipmentNo}">GET /api/v1/shipments/{shipmentNo}</option>
            <option value="POST /api/v1/batch/orders">POST /api/v1/batch/orders</option>
            <option value="GET /api/v1/warehouses">GET /api/v1/warehouses</option>
          </select>
        </div>
        <div class="op-filter-item">
          <span class="op-filter-label">状态码</span>
          <select class="op-select" id="filterStatus">
            <option value="">全部</option>
            <option value="2xx">2xx 成功</option>
            <option value="4xx">4xx 客户端错误</option>
            <option value="5xx">5xx 服务端错误</option>
          </select>
        </div>
        <div class="op-filter-item">
          <span class="op-filter-label">关键词</span>
          <input class="op-input op-filter-keyword" type="text" id="filterKeyword" placeholder="搜索订单号、请求内容">
        </div>
        <div class="op-filter-item" style="flex-direction:row;gap:8px;align-self:flex-end">
          <button class="op-btn op-btn-primary" onclick="doSearch()">
            <i class="ri-search-line"></i>查询
          </button>
          <button class="op-btn op-btn-default" onclick="doReset()">
            <i class="ri-refresh-line"></i>重置
          </button>
        </div>
      </div>

      <!-- 日志列表卡片 -->
      <div class="op-log-card">
        <div class="op-table-wrap">
          <table class="op-table" id="logTable">
            <thead>
              <tr>
                <th style="min-width:170px">请求时间</th>
                <th style="min-width:70px">Key类型</th>
                <th style="min-width:90px">应用</th>
                <th style="min-width:220px">接口</th>
                <th style="min-width:70px">状态码</th>
                <th style="min-width:70px">耗时</th>
                <th style="min-width:110px">请求ID</th>
              </tr>
            </thead>
            <tbody id="logTableBody">
              <!-- JS动态渲染 -->
            </tbody>
          </table>
        </div>
        <!-- 分页器 -->
        <div class="op-pagination" id="pagination">
          <div class="op-pagination-info" id="paginationInfo"></div>
          <div class="op-pagination-pages" id="paginationPages"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Toast容器 -->
<div class="op-toast-stack" id="opToastStack"></div>

<!-- ====== 日志详情弹窗 ====== -->
<div class="op-modal-mask" id="detailModal">
  <div class="op-modal op-modal-xl">
    <div class="op-modal-head">
      <span class="op-modal-title">请求详情</span>
      <button class="op-modal-close" onclick="closeModal('detailModal')"><i class="ri-close-line"></i></button>
    </div>
    <div class="op-modal-body" style="max-height:70vh;overflow-y:auto;padding:20px 24px">

      <!-- 请求信息区 -->
      <div class="op-detail-section">
        <div class="op-detail-section-title">
          <i class="ri-upload-cloud-line"></i>请求信息
        </div>
        <div class="op-req-meta" id="detailReqMeta">
          <!-- JS渲染: Method标签 + URL -->
        </div>
        <table class="op-header-table" id="detailReqHeaders">
          <!-- JS渲染: Header列表 -->
        </table>
        <div style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:6px;font-weight:600">请求Body</div>
        <div class="op-json-block" id="detailReqBody">
          <!-- JS渲染: 格式化JSON -->
        </div>
      </div>

      <!-- 响应信息区 -->
      <div class="op-detail-section">
        <div class="op-detail-section-title">
          <i class="ri-download-cloud-line"></i>响应信息
        </div>
        <div style="margin-bottom:12px" id="detailResStatus">
          <!-- JS渲染: 状态码标签 -->
        </div>
        <table class="op-header-table" id="detailResHeaders">
          <!-- JS渲染: Header列表 -->
        </table>
        <div style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:6px;font-weight:600">响应Body</div>
        <div class="op-json-block" id="detailResBody">
          <!-- JS渲染: 格式化JSON -->
        </div>
      </div>

      <!-- 耗时区 -->
      <div class="op-detail-section">
        <div class="op-detail-section-title">
          <i class="ri-timer-line"></i>耗时
        </div>
        <div class="op-duration-display" id="detailDuration">
          <!-- JS渲染: 大字耗时 -->
        </div>
        <div id="detailErrorInfo">
          <!-- JS渲染: 错误信息（如有） -->
        </div>
      </div>

    </div>
    <div class="op-modal-footer">
      <button class="op-btn op-btn-default" onclick="closeModal('detailModal')">关闭</button>
    </div>
  </div>
</div>

<script src="../assets/js/open-platform.js"></script>

  /* ---- 渲染方法标签 ---- */
  function renderMethodTag(method) {
    var cls = 'op-method-' + method.toLowerCase();
    return '<span class="op-method-tag ' + cls + '">' + method + '</span>';
  }

  /* ---- 渲染Key类型标签 ---- */
  function renderKeyTypeTag(type) {
    if (type === 'prod') {
      return '<span class="op-tag-prod">生产</span>';
    }
    return '<span class="op-tag-test">测试</span>';
  }

  /* ---- 渲染状态码标签 ---- */
  function renderStatusCode(code) {
    var cls;
    if (code === 401) cls = 'op-code-401';
    else if (code === 429) cls = 'op-code-429';
    else if (code >= 200 && code < 300) cls = 'op-code-2xx';
    else if (code >= 400 && code < 500) cls = 'op-code-4xx';
    else cls = 'op-code-5xx';
    return '<span class="op-status-code ' + cls + '">' + code + '</span>';
  }

  /* ---- 渲染耗时 ---- */
  function renderDuration(ms) {
    var cls = 'fast';
    if (ms > 3000) cls = 'danger';
    else if (ms > 1000) cls = 'warning';
    return '<span class="op-duration ' + cls + '">' + ms + 'ms</span>';
  }

  /* ---- 根据appId查找应用名称 ---- */
  function getAppName(appId) {
    for (var i = 0; i < _apps.length; i++) {
      if (_apps[i].id === appId) return _apps[i].name;
    }
    return '—';
  }

  /* ---- 渲染日志列表 ---- */
  function renderTable(data) {
    var tbody = document.getElementById('logTableBody');
    var html = '';
    for (var i = 0; i < data.length; i++) {
      var row = data[i];
      html += '<tr>' +
        '<td style="font-family:SF Mono,Consolas,Monaco,monospace;white-space:nowrap">' + row.time + '</td>' +
        '<td>' + renderKeyTypeTag(row.keyType) + '</td>' +
        '<td style="white-space:nowrap">' + getAppName(row.appId) + '</td>' +
        '<td style="white-space:nowrap">' + renderMethodTag(row.method) + '<span style="font-family:SF Mono,Consolas,Monaco,monospace;font-size:12px;color:var(--color-text-secondary)">' + row.path + '</span></td>' +
        '<td>' + renderStatusCode(row.status) + '</td>' +
        '<td>' + renderDuration(row.duration) + '</td>' +
        '<td><a class="op-req-id" onclick="showDetail(' + i + ')">' + row.reqId + '</a></td>' +
        '</tr>';
    }
    tbody.innerHTML = html;
  }

  /* ---- 渲染分页器 ---- */
  function renderPagination(total, pageSize, current) {
    var totalPages = Math.ceil(total / pageSize);
    var info = document.getElementById('paginationInfo');
    info.innerHTML = '共 <strong>' + total + '</strong> 条，每页 ' + pageSize + ' 条，当前第 <strong>' + current + '</strong> 页';

    var pages = document.getElementById('paginationPages');
    var html = '';
    html += '<button class="op-page-btn" ' + (current <= 1 ? 'disabled' : '') + '><i class="ri-arrow-left-s-line"></i></button>';
    for (var p = 1; p <= totalPages; p++) {
      html += '<button class="op-page-btn' + (p === current ? ' active' : '') + '">' + p + '</button>';
    }
    html += '<button class="op-page-btn" ' + (current >= totalPages ? 'disabled' : '') + '><i class="ri-arrow-right-s-line"></i></button>';
    pages.innerHTML = html;
  }

  /* ---- JSON语法高亮 ---- */
  function highlightJSON(obj) {
    if (obj === null || obj === undefined) return '<span class="json-null">null</span>';
    var jsonStr = JSON.stringify(obj, null, 2);
    // 转义HTML
    jsonStr = jsonStr.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // 高亮key
    jsonStr = jsonStr.replace(/"([^"]+)"(\s*:)/g, '<span class="json-key">"$1"</span>$2');
    // 高亮字符串值
    jsonStr = jsonStr.replace(/:\s*"([^"]*)"/g, ': <span class="json-str">"$1"</span>');
    // 高亮数字
    jsonStr = jsonStr.replace(/:\s*(-?\d+\.?\d*)/g, ': <span class="json-num">$1</span>');
    // 高亮布尔值
    jsonStr = jsonStr.replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>');
    // 高亮null
    jsonStr = jsonStr.replace(/:\s*(null)/g, ': <span class="json-null">$1</span>');
    return jsonStr;
  }

  /* ---- 渲染Header表格 ---- */
  function renderHeaderTable(headers) {
    var html = '<thead><tr><th>Header</th><th>值</th></tr></thead><tbody>';
    for (var i = 0; i < headers.length; i++) {
      html += '<tr><td>' + headers[i].name + '</td><td>' + headers[i].value + '</td></tr>';
    }
    html += '</tbody>';
    return html;
  }

  /* ---- 弹窗工具函数 ---- */
  function openModal(id) {
    var el = document.getElementById(id);
    if (el) {
      requestAnimationFrame(function () { el.classList.add('visible'); });
    }
  }

  window.closeModal = function (id) {
    var el = document.getElementById(id);
    if (el) {
      el.classList.remove('visible');
    }
  };

  // 点击遮罩关闭
  document.addEventListener('click', function (e) {
    if (e.target.classList.contains('op-modal-mask') && e.target.classList.contains('visible')) {
      e.target.classList.remove('visible');
    }
  });

  /* ---- 显示日志详情 ---- */
  window.showDetail = function (idx) {
    var row = LOG_DATA[idx];

    // 请求信息
    document.getElementById('detailReqMeta').innerHTML =
      renderMethodTag(row.method) +
      '<span class="op-req-meta-url">' + row.path + '</span>';

    document.getElementById('detailReqHeaders').innerHTML = renderHeaderTable(row.reqHeaders);

    if (row.reqBody) {
      document.getElementById('detailReqBody').innerHTML = highlightJSON(row.reqBody);
      document.getElementById('detailReqBody').style.display = '';
      document.getElementById('detailReqBody').previousElementSibling.style.display = '';
    } else {
      document.getElementById('detailReqBody').innerHTML = '<span style="color:var(--color-text-tertiary);font-style:italic">无请求Body</span>';
    }

    // 响应信息
    document.getElementById('detailResStatus').innerHTML = renderStatusCode(row.status);
    document.getElementById('detailResHeaders').innerHTML = renderHeaderTable(row.resHeaders);
    document.getElementById('detailResBody').innerHTML = highlightJSON(row.resBody);

    // 耗时
    var durationCls = 'fast';
    if (row.duration > 3000) durationCls = 'danger';
    else if (row.duration > 1000) durationCls = 'warning';

    document.getElementById('detailDuration').innerHTML =
      '<span class="op-duration-value ' + durationCls + '">' + row.duration + '</span>' +
      '<span class="op-duration-unit">ms</span>';

    // 错误信息（如有）
    var errorHtml = '';
    if (row.status >= 400 && row.resBody && row.resBody.error) {
      var err = row.resBody.error;
      errorHtml = '<div class="op-duration-error">' +
        '<i class="ri-error-warning-line"></i>' +
        '<div>' +
        '<div style="font-weight:600;margin-bottom:4px">' + err.code + '</div>' +
        '<div>' + err.message + '</div>' +
        '</div>' +
        '</div>';
    }
    document.getElementById('detailErrorInfo').innerHTML = errorHtml;

    openModal('detailModal');
  };

  /* ---- 筛选逻辑 ---- */
  window.doSearch = function () {
    var app = document.getElementById('filterApp').value;
    var keyType = document.getElementById('filterKeyType').value;
    var api = document.getElementById('filterApi').value;
    var status = document.getElementById('filterStatus').value;
    var keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

    var filtered = LOG_DATA.filter(function (row) {
      // 应用筛选
      if (app && row.appId !== app) return false;
      // Key类型筛选
      if (keyType && row.keyType !== keyType) return false;
      // 接口筛选
      if (api) {
        var fullApi = row.method + ' ' + row.path;
        if (fullApi !== api) return false;
      }
      // 状态码筛选
      if (status) {
        if (status === '2xx' && (row.status < 200 || row.status >= 300)) return false;
        if (status === '4xx' && (row.status < 400 || row.status >= 500)) return false;
        if (status === '5xx' && (row.status < 500 || row.status >= 600)) return false;
      }
      // 关键词搜索
      if (keyword) {
        var searchStr = (row.reqId + ' ' + row.path + ' ' + JSON.stringify(row.reqBody) + ' ' + JSON.stringify(row.resBody)).toLowerCase();
        if (searchStr.indexOf(keyword) === -1) return false;
      }
      return true;
    });

    renderTable(filtered);
    renderPagination(filtered.length, 20, 1);
    OP.showToast('查询完成，共' + filtered.length + '条记录', 'success');
  };

  window.doReset = function () {
    document.getElementById('filterDateStart').value = todayStr;
    document.getElementById('filterDateEnd').value = todayStr;
    document.getElementById('filterApp').value = '';
    document.getElementById('filterKeyType').value = '';
    document.getElementById('filterApi').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterKeyword').value = '';
    renderTable(LOG_DATA);
    renderPagination(LOG_DATA.length, 20, 1);
  };

  /* ---- 动态填充应用筛选 ---- */
  var apps = OP.getApps();
  var appFilter = document.getElementById('filterApp');
  appFilter.innerHTML = '<option value="">全部应用</option>';
  apps.forEach(function(app) {
    appFilter.innerHTML += '<option value="' + app.id + '">' + app.name + '</option>';
  });

  /* ---- 初始渲染 ---- */
  renderTable(LOG_DATA);
  renderPagination(LOG_DATA.length, 20, 1);

})();
</script>
</body>
</html>
